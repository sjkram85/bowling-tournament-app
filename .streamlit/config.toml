[theme]
base = "dark"
primaryColor = "#2563EB"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"

[client]
# Hide the developer/deploy menu from TDs and bowlers.
toolbarMode = "viewer"
# Don't show Python tracebacks to users; Prism shows its own friendly messages.
showErrorDetails = false
