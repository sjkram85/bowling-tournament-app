[theme]
base = "dark"
primaryColor = "#2563EB"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"

[client]
# "auto" keeps the normal menu for admins; components/hide_chrome.py hides it for everyone else.
toolbarMode = "auto"
# Don't show Python tracebacks to users; Prism shows its own friendly messages.
showErrorDetails = false
